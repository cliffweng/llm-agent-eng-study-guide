title: LLM & Agent Engineering Study Guide
description: >-
  A practical study guide for software engineers learning LLM and agent
  engineering — for building real systems and for interview prep.
baseurl: "/llm-agent-eng-study-guide"
url: "https://cliffweng.github.io"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

nav_sort: case_insensitive
heading_anchors: true

aux_links:
  "View on GitHub":
    - "https://github.com/cliffweng/llm-agent-eng-study-guide"
aux_links_new_tab: true

footer_content: "Copyright &copy; 2026. Distributed under the MIT License."

back_to_top: true
back_to_top_text: "Back to top"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CONTRIBUTING.md
